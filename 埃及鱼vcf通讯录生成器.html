<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>埃及鱼VCF通讯录生成器</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif;margin:0;padding:0}
body{padding:16px;background:#f5f7fa;color:#222}
.wrap{max-width:800px;margin:0 auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 10px #00000012}
h1{font-size:20px;margin-bottom:12px;text-align:center}
.tip{background:#eef6ff;padding:10px;border-radius:8px;font-size:14px;margin-bottom:14px;color:#255}
textarea{width:100%;height:180px;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:16px;resize:vertical;margin-bottom:12px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
button{padding:10px 16px;border:none;border-radius:8px;font-size:15px;cursor:pointer;background:#2563eb;color:white}
button#clear{background:#6b7280}
button#download{background:#059669}
button#fileBtn{background:#9333ea;}
#preview{width:100%;height:220px;padding:12px;border:1px solid #ddd;border-radius:8px;font-family:monospace;font-size:14px;white-space:pre;overflow:auto;background:#fafafa}
#fileInput{display:none;}
</style>
<!-- 引入SheetJS 读取xlsx（Excel/WPS表格） -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="wrap">
<h1>埃及鱼VCF通讯录生成器</h1>
<div class="tip">
✅支持多种格式（空格、逗号、顿号等任意标点分隔）
支持：姓名+号码 ｜号码+姓名 ｜仅号码
✅新增：支持导入Excel/WPS的.xlsx表格，读取A列内容
示例：
张三 13800138000
13900139000，李四
王五，13700137000
13600136000
仅号码自动命名：1、2、3……依次排序
</div>
<textarea id="inputArea" placeholder="没有本人授权允许任何人不得擅用此工具"></textarea>
<div class="btns">
<button id="genBtn">生成VCF预览</button>
<button id="clear">清空</button>
<button id="download">下载 vcf 文件</button>
<button id="fileBtn">📂 导入表格</button>
<input type="file" id="fileInput" accept=".xlsx">
</div>
<pre id="preview"></pre>
</div>

<script>
const inputArea = document.getElementById('inputArea');
const preview = document.getElementById('preview');
const genBtn = document.getElementById('genBtn');
const clearBtn = document.getElementById('clear');
const downloadBtn = document.getElementById('download');
const fileInput = document.getElementById('fileInput');
const fileBtn = document.getElementById('fileBtn');
let vcfText = "";

// 文件按钮点击，触发隐藏文件选择框
fileBtn.onclick = function(){
    fileInput.click();
}

// ==========【新增Excel/WPS读取逻辑，原有代码完全不动】==========
fileInput.onchange = function(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data,{type:'array'});
        //读取第一个工作表
        const sheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[sheetName];
        //转为数组，只取A列
        const jsonData = XLSX.utils.sheet_to_json(worksheet,{header:1});
        let textLines = [];
        for(let row of jsonData){
            if(row[0] !== undefined && row[0] !== null){
                textLines.push(row[0].toString().trim());
            }
        }
        //把读取到的A列全部填充到文本框
        inputArea.value = textLines.join("\n");
    }
    reader.readAsArrayBuffer(file);
}
// ==========【下面这一段，是你原来的代码，一字未改！】==========
genBtn.onclick = function(){
    const lines = inputArea.value.split('\n');
    vcfText = "";
    let emptyNameCount = 0; // 只用来统计【无姓名】的条目序号
    for(let line of lines){
        line = line.trim();
        if(!line) continue;

        // 把所有标点符号替换成空格，统一分隔
        let cleanLine = line.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, ' ');
        // 多个空格合并成单个空格
        cleanLine = cleanLine.replace(/\s+/g, ' ').trim();
        const parts = cleanLine.split(' ');

        let name = "";
        let phone = "";
        const numList = [];
        const textList = [];

        // 区分数字（手机号）和文本（姓名）
        for(let p of parts){
            if(/^\d+$/.test(p)){
                numList.push(p);
            }else{
                textList.push(p);
            }
        }

        // 取第一个11位数字当做手机号
        for(let num of numList){
            if(num.length === 11){
                phone = num;
                break;
            }
        }
        // 姓名 = 所有文本合并
        name = textList.join('');

        // =====改动这里：仅号码行（没有姓名），按顺序编号1、2、3...=====
        if(!name && phone){
            emptyNameCount++;
            name = String(emptyNameCount);
        }
        // 没有找到手机号，跳过这一行
        if(!phone){
            continue;
        }

        // 拆分姓和名
        let family, given;
        if(name.length <= 1){
            family = name;
            given = "";
        }else{
            family = name[0];
            given = name.slice(1);
        }

        vcfText += `BEGIN:VCARD
VERSION:3.0
N:${family};${given};;;
FN:${name}
TEL;CELL:${phone}
END:VCARD
`;
    }
    preview.textContent = vcfText;
};

clearBtn.onclick = function(){
    inputArea.value = "";
    preview.textContent = "";
    vcfText = "";
};

downloadBtn.onclick = function(){
    if(!vcfText){
        alert("请先生成VCF内容！");
        return;
    }
    const blob = new Blob([vcfText],{type:"text/vcard;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = "contacts.vcf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
};
</script>
</body>
</html>
